<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Role - BatiStock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2>Choose Your Role</h2>
            <div class="role-selection">
                <button class="role-button" data-role="admin">Admin</button>
                <button class="role-button" data-role="pm">Project Manager</button>
                <button class="role-button" data-role="sales">Sales</button>
                <button class="role-button" data-role="accountant">Accountant</button>
                <button class="role-button" data-role="field-agent">Field Agent</button>
            </div>
        </div>
    </div>
    <script src="js/role-selection.js"></script>
</body>
</html>
