<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard - BatiStock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <button id="menuBtn" class="menu-btn">&#9776;</button>
            <h1>BatiStock</h1>
        </div>
        <nav>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>
    <main class="dashboard-main">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#pos">POS Interface</a></li>
                    <li><a href="#customer-quick-add">Customer Quick Add</a></li>
                    <li><a href="#fast-receipts">Fast Receipts</a></li>
                </ul>
            </nav>
        </aside>
        <section class="content">
            <div id="pos" class="panel">
                <h2>POS Interface</h2>
                <button class="action-button">New Sale</button>
                <input type="text" placeholder="Search for products..." class="search-bar">
                <div class="category-buttons">
                    <button class="category-button">Cement</button>
                    <button class="category-button">Nails</button>
                    <button class="category-button">Paint</button>
                </div>
            </div>
            <div id="customer-quick-add" class="panel">
                <h2>Customer Quick Add</h2>
                <input type="text" placeholder="Enter customer name..." class="search-bar">
                <button class="action-button">Add Customer</button>
            </div>
            <div id="fast-receipts" class="panel">
                <h2>Fast Receipts</h2>
                <button class="action-button">Generate Receipt</button>
                <button class="action-button">Print Receipt</button>
                <button class="action-button">Share Receipt</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 BatiStock. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
