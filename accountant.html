<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountant Dashboard - BatiStock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>BatiStock</h1>
        <nav>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>
    <main class="dashboard-main">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#reports">Reports</a></li>
                    <li><a href="#export-data">Export Data</a></li>
                </ul>
            </nav>
        </aside>
        <section class="content">
            <div id="reports" class="panel">
                <h2>Reports</h2>
                <button class="action-button">View Sales Report</button>
                <button class="action-button">View Inventory Report</button>
            </div>
            <div id="export-data" class="panel">
                <h2>Export Data</h2>
                <button class="action-button">Export as CSV</button>
                <button class="action-button">Export as PDF</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 BatiStock. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
