<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Application | UAI</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .form-step {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            max-width: 800px;
            margin: 0 auto 50px;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="sub-page">
    <header id="main-header">
        <div class="container">
            <nav>
                <div class="logo">U<span>AI</span></div>
            </nav>
        </div>
    </header>

    <section class="container" style="padding-top: 120px;">
        <div class="section-title reveal">
            <h2>Join the UAI Innovation Network</h2>
            <p>Start your journey as a member and stakeholder in African transformation.</p>
        </div>

        <div class="form-step reveal">
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="First and Last Name">
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>National ID Number</label>
                        <input type="text" placeholder="ID Card or Passport Number">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="+237 ...">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>Residential Address</label>
                    <textarea rows="3" placeholder="Full Address"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Occupation</label>
                        <input type="text" placeholder="Profession">
                    </div>
                    <div class="form-group">
                        <label>Next of Kin</label>
                        <input type="text" placeholder="Full Name">
                    </div>
                </div>

                <div class="form-group">
                    <label>Upload Documents (ID/Passport)</label>
                    <input type="file" style="border: none; padding: 0;">
                </div>

                <div style="margin: 30px 0; padding: 20px; background: #fff8e1; border-radius: 10px; font-size: 0.85rem; color: #795548;">
                    <p><strong>Note:</strong> Upon submission, your application will be reviewed by the Secretary General. You will receive an email notification regarding your membership status and contribution details.</p>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">Submit Application</button>
            </form>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/visuals.js"></script>
</body>
</html>
