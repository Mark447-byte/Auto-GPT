<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>School Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1>Edit Student</h1>
        <form th:action="@{/students/{id}(id=${student.id})}" th:object="${student}" method="post">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" th:field="*{name}" class="form-control" placeholder="Enter Name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" th:field="*{email}" class="form-control" placeholder="Enter Email">
            </div>
            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course" th:field="*{course}" class="form-control" placeholder="Enter Course">
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </div>
</body>
</html>
