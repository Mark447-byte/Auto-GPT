<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Agent Dashboard - BatiStock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <button id="menuBtn" class="menu-btn">&#9776;</button>
            <h1>BatiStock</h1>
        </div>
        <nav>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>
    <main class="dashboard-main">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#rural-delivery">Rural Delivery</a></li>
                    <li><a href="#mobile-sales">Mobile Sales</a></li>
                </ul>
            </nav>
        </aside>
        <section class="content">
            <div id="rural-delivery" class="panel">
                <h2>Rural Delivery</h2>
                <button class="action-button">View Delivery Route</button>
                <button class="action-button">Update Delivery Status</button>
            </div>
            <div id="mobile-sales" class="panel">
                <h2>Mobile Sales</h2>
                <button class="action-button">New Mobile Sale</button>
                <button class="action-button">View Mobile Sales</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 BatiStock. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
