<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager Dashboard - BatiStock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <button id="menuBtn" class="menu-btn">&#9776;</button>
            <h1>BatiStock</h1>
        </div>
        <nav>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>
    <main class="dashboard-main">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#material-dashboard">Material Dashboard</a></li>
                    <li><a href="#team-assignments">Team Assignments</a></li>
                    <li><a href="#notifications">Notifications</a></li>
                    <li><a href="#communication-board">Communication Board</a></li>
                </ul>
            </nav>
        </aside>
        <section class="content">
            <div id="projects" class="panel">
                <h2>Projects</h2>
                <button class="action-button">Create Project</button>
                <button class="action-button">View Projects</button>
            </div>
            <div id="material-dashboard" class="panel">
                <h2>Material Dashboard</h2>
                <button class="action-button">Allocate Materials</button>
                <button class="action-button">View Allocations</button>
            </div>
            <div id="team-assignments" class="panel">
                <h2>Team Assignments</h2>
                <button class="action-button">Assign Team Member</button>
                <button class="action-button">View Team</button>
            </div>
            <div id="notifications" class="panel">
                <h2>Notifications</h2>
                <button class="action-button">View Notifications</button>
            </div>
            <div id="communication-board" class="panel">
                <h2>Communication Board</h2>
                <button class="action-button">Add Comment</button>
                <button class="action-button">Upload File</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 BatiStock. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
